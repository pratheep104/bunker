<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BUNKER - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0A0A0A;
      color: #a3a3a3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { text-align: center; max-width: 320px; }
    h1 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    p { font-size: 14px; color: #525252; line-height: 1.5; margin-bottom: 20px; }
    .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }
    .footer { font-size: 10px; color: #333; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">&#x26A0;</div>
    <h1>You're Offline</h1>
    <p>BUNKER requires an internet connection to fetch your attendance data. Please check your connection and try again.</p>
    <p class="footer">Created by Heisenberg</p>
  </div>
</body>
</html>
